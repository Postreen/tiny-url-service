databaseChangeLog:
  - changeSet:
      id: 001-create-links-table
      author: Artem Sazonov

      changes:
        - createTable:
            tableName: links
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: original_url
                  type: VARCHAR(2048)
                  constraints:
                    nullable: false

              - column:
                  name: short_code
                  type: VARCHAR(32)

              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE

              - column:
                  name: status
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: links
            columnNames: short_code
            constraintName: uk_links_short_code