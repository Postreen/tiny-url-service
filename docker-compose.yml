services:
  postgres:
    image: postgres:17-alpine
    container_name: tinyurl-postgres
    environment:
      POSTGRES_DB: url_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d url_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  tinyurl:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tinyurl
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/url_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SERVER_PORT: 8080
    restart: unless-stopped

volumes:
  postgres-data: